services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.10.2
    command:
    restart: unless-stopped
    env_file:
      - open-webui.env
    networks:
      - front_end
      - back_end
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      postgres:
        condition: "service_started"
        restart: true

volumes:
  open-webui-data:
    name: open-webui_data
